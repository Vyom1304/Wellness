<!DOCTYPE html>
<html lang="en" data-theme="auto"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:oklch(0.972 0.006 85);--card:oklch(0.993 0.003 85);--sunk:oklch(0.94 0.007 85);
  --ink:oklch(0.24 0.012 70);--ink2:oklch(0.44 0.012 70);--ink3:oklch(0.58 0.01 70);
  --line:oklch(0.89 0.008 80);--rule:oklch(0.935 0.008 80);
  --accent:oklch(0.5 0.09 170);--accent-ink:oklch(0.99 0.005 170);--accent-soft:oklch(0.935 0.03 170);
  --protein:oklch(0.6 0.12 30);--carbs:oklch(0.68 0.12 80);--fat:oklch(0.58 0.1 255);
  --danger:oklch(0.52 0.16 25);--danger-soft:oklch(0.95 0.03 25);
  --shadow:0 1px 2px oklch(0.3 0.02 70 / .06),0 8px 24px oklch(0.3 0.02 70 / .06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:oklch(0.185 0.008 70);--card:oklch(0.225 0.009 70);--sunk:oklch(0.27 0.01 70);
  --ink:oklch(0.94 0.008 85);--ink2:oklch(0.76 0.01 80);--ink3:oklch(0.62 0.01 80);
  --line:oklch(0.31 0.01 70);--rule:oklch(0.215 0.008 70);
  --accent:oklch(0.74 0.1 170);--accent-ink:oklch(0.2 0.03 170);--accent-soft:oklch(0.3 0.04 170);
  --protein:oklch(0.72 0.12 30);--carbs:oklch(0.78 0.12 80);--fat:oklch(0.72 0.1 255);
  --danger:oklch(0.7 0.15 25);--danger-soft:oklch(0.3 0.05 25);
  --shadow:0 1px 2px #0004,0 8px 24px #0005;color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:oklch(0.185 0.008 70);--card:oklch(0.225 0.009 70);--sunk:oklch(0.27 0.01 70);
  --ink:oklch(0.94 0.008 85);--ink2:oklch(0.76 0.01 80);--ink3:oklch(0.62 0.01 80);
  --line:oklch(0.31 0.01 70);--rule:oklch(0.215 0.008 70);
  --accent:oklch(0.74 0.1 170);--accent-ink:oklch(0.2 0.03 170);--accent-soft:oklch(0.3 0.04 170);
  --protein:oklch(0.72 0.12 30);--carbs:oklch(0.78 0.12 80);--fat:oklch(0.72 0.1 255);
  --danger:oklch(0.7 0.15 25);--danger-soft:oklch(0.3 0.05 25);
  --shadow:0 1px 2px #0004,0 8px 24px #0005;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4;color:var(--ink);background:var(--bg);
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:var(--ink)}
.mono,.num{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}.faint{color:var(--ink3)}
.view{max-width:560px;margin:0 auto;padding:0 16px calc(104px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(20px + env(safe-area-inset-top)) 0 16px}
.eyebrow{font:500 11px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
h1{font-size:30px;line-height:1.1;font-weight:600;letter-spacing:-.02em;margin-top:6px}
h2{font-size:17px;font-weight:600;letter-spacing:-.01em}
h3{font-size:15px;font-weight:600}
.big{font-size:44px;font-weight:500;letter-spacing:-.035em;line-height:1}
.mid{font-size:28px;font-weight:500;letter-spacing:-.03em;line-height:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.row{display:flex;align-items:center;gap:10px}
.sb{justify-content:space-between}
.wrap{flex-wrap:wrap}
.gap4{gap:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt4{margin-top:4px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.lg{min-height:52px;font-size:16px}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)}
.btn.danger{color:var(--danger);border-color:var(--line)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.icon-btn{width:44px;height:44px;flex:none;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1}
.icon-btn.flat{border-color:transparent;background:transparent}
.icon-btn.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chips{display:flex;gap:8px}
.chips.scroll{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px;flex:none}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .q{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink3)}
.chip.on .q{color:inherit;opacity:.7}
.chip.sub{min-height:38px;font-size:13px}
.seg{display:flex;background:var(--sunk);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;min-height:38px;border-radius:8px;font-weight:500;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px oklch(0.3 0.02 70 / .12)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;transition:width .4s}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.input{min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;width:100%;min-width:0}
.input:focus,.cell:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.input.err{border-color:var(--danger)}
label.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.list-row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.list-row:first-child{border-top:0}
.chev{color:var(--ink3);font-size:18px}
.skel{background:linear-gradient(90deg,var(--sunk) 0%,var(--line) 50%,var(--sunk) 100%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px}
@keyframes sh{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;flex:none;opacity:.7}
.empty{padding:28px 12px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty b{color:var(--ink);font-weight:600}
.empty-line{color:var(--ink3);font-size:14px;padding:6px 0 10px}
/* status / toast / rest */
#status{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:40;pointer-events:none}
#status .pill{pointer-events:auto;display:flex;align-items:center;gap:8px;height:32px;padding:0 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);font:500 12px 'IBM Plex Mono',monospace;color:var(--ink2);animation:fade .2s}
#status .pill.err{color:var(--danger);border-color:var(--danger)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:45;display:flex;justify-content:center;pointer-events:none}
#toast .t{pointer-events:auto;max-width:520px;width:100%;display:flex;align-items:center;gap:8px;min-height:52px;padding:4px 6px 4px 16px;border-radius:12px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);animation:up .2s;font-size:14px}
#toast .t span{flex:1}
#toast .t button{min-height:44px;padding:0 12px;font-weight:600;color:var(--bg);border-radius:8px}
#rest{position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;display:flex;justify-content:center;pointer-events:none}
#rest .r{pointer-events:auto;max-width:528px;width:100%;position:relative;overflow:hidden;display:flex;align-items:center;gap:6px;height:56px;padding:0 6px 0 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
#rest .r i{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
#rest .r b{font:500 22px 'IBM Plex Mono',monospace;flex:1}
#rest .r button{min-height:44px;min-width:44px;padding:0 10px;font:500 13px 'IBM Plex Mono',monospace;color:var(--ink2);border-radius:8px}
/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:0 4px env(safe-area-inset-bottom)}
#nav button{flex:1;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--ink3)}
#nav button.on{color:var(--accent)}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#nav .brand{display:none}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:25;height:56px;padding:0 20px 0 16px;border-radius:28px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);font-size:15px}
.fab span{font-size:24px;line-height:1;font-weight:400}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
.sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:oklch(0.2 0.01 70 / .4)}
.sheet-wrap.anim .backdrop{animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92vh;overflow:auto;overscroll-behavior:contain;background:var(--card);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-wrap.anim .sheet{animation:up .24s cubic-bezier(.2,.8,.2,1)}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh-head h2{font-size:22px;margin-top:4px}
/* today */
.cal{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ring-c .big{font-size:34px}
.cal-stats{display:flex;flex-direction:column;gap:12px;flex:1}
.cal-stats dd{font:500 22px 'IBM Plex Mono',monospace;margin-top:3px;letter-spacing:-.02em}
.macro{display:flex;flex-direction:column;gap:6px}
.macro .row{font-size:14px}
.macro .num{font-size:13px;color:var(--ink2)}
.macro .num b{color:var(--ink);font-weight:500;font-size:15px}
.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:12px 0}
.cells i{height:14px;border-radius:3px;background:var(--sunk)}
.cells i.on{background:var(--fat)}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.days i{aspect-ratio:1;border-radius:3px;background:var(--sunk)}
.days i.on{background:var(--accent)}
.days i.today{outline:1.5px solid var(--ink3);outline-offset:1px}
.meal{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.meal:first-of-type{border-top:0;margin-top:4px}
.meal-h{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px}
.entry{display:flex;align-items:center;gap:12px;min-height:52px;padding:6px 0;cursor:pointer;border-radius:8px}
.entry:hover{background:var(--sunk);margin:0 -8px;padding:6px 8px}
.e-main{flex:1;min-width:0}
.e-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-sub{font-size:12px;color:var(--ink3);margin-top:2px;display:flex;align-items:center;gap:6px}
.e-r{text-align:right}
.e-k{font:500 15px 'IBM Plex Mono',monospace}
.mac{font:400 11px 'IBM Plex Mono',monospace;display:flex;gap:6px;justify-content:flex-end;margin-top:2px}
.saving{color:var(--ink3)}
.errtag{color:var(--danger);display:flex;align-items:center;gap:6px}
.retry{min-height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--danger);color:var(--danger);font-size:12px;font-weight:600}
/* qty sheet */
.qty{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.qty input{flex:1;min-width:0;text-align:center;height:64px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font:500 36px 'IBM Plex Mono',monospace;letter-spacing:-.03em}
.qty input:focus{outline:2px solid var(--accent);border-color:transparent}
.qty .icon-btn{width:56px;height:64px;font-size:26px}
.unitlbl{font:500 13px 'IBM Plex Mono',monospace;color:var(--ink3);text-align:center}
.preview{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:8px;background:var(--sunk);border-radius:12px;padding:12px;margin:14px 0}
.preview div{display:flex;flex-direction:column;gap:4px}
.preview b{font:500 20px 'IBM Plex Mono',monospace;letter-spacing:-.02em}
.preview .k b{font-size:26px}
.mtag{font:500 11px 'IBM Plex Mono',monospace;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:5px;color:var(--ink3)}
/* workout */
.ex-card{padding:14px 14px 10px}
.last{display:inline-flex;align-items:center;gap:6px;margin-top:6px;padding:4px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font:500 12px 'IBM Plex Mono',monospace}
.sets-h,.set{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 54px 48px;gap:6px;align-items:center}
.sets-h{font:500 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:12px 0 4px;text-align:center}
.set{padding:3px 0;border-radius:10px}
.set.done .cell{background:var(--accent-soft);border-color:transparent}
.set .n{font:500 13px 'IBM Plex Mono',monospace;color:var(--ink3);text-align:center}
.cell{height:44px;width:100%;min-width:0;border:1px solid var(--line);border-radius:9px;background:var(--bg);text-align:center;font:500 17px 'IBM Plex Mono',monospace}
.cell::placeholder{color:var(--ink3);opacity:.7}
.check{height:44px;width:48px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;background:var(--card)}
.check svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.25}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check.on svg{opacity:1}
.check.err{border-color:var(--danger);color:var(--danger)}
.wo-head{position:sticky;top:0;z-index:5;background:var(--bg);margin:0 -16px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--line)}
.tpl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tpl button{text-align:left;padding:14px;min-height:92px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.tpl button.next{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font:500 24px 'IBM Plex Mono',monospace;letter-spacing:-.03em}
.stats3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.pr{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prtag{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.08em;padding:4px 6px;border-radius:5px;background:var(--accent);color:var(--accent-ink)}
/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tl{font:10px 'IBM Plex Mono',monospace;fill:var(--ink3)}
.chart .vl{font:500 10px 'IBM Plex Mono',monospace;fill:var(--ink2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:12px 'IBM Plex Mono',monospace;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.mrow{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;min-height:26px;font-size:13px}
.mtrack{position:relative;height:10px;border-radius:3px;background:var(--sunk);overflow:hidden}
.mtrack .band{position:absolute;top:0;bottom:0;background:var(--accent-soft)}
.mtrack i{position:absolute;left:0;top:2px;bottom:2px;border-radius:2px;background:var(--ink2)}
.mtrack i.ok{background:var(--accent)}
.energy{display:grid;grid-template-columns:repeat(28,1fr);gap:3px}
.energy i{height:22px;border-radius:2px;background:var(--accent)}
.sum2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0}
.sum2>div{padding:0 0 0 14px;border-left:1px solid var(--line)}
.sum2>div:first-child{padding:0 14px 0 0;border-left:0}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.kv b{font:500 15px 'IBM Plex Mono',monospace}
.delta{font:11px 'IBM Plex Mono',monospace;color:var(--ink3)}
.mtags{display:flex;flex-wrap:wrap;gap:6px}
.mt{padding:5px 10px;border-radius:6px;font-size:13px;background:var(--ink);color:var(--bg)}
.mt.sec{background:transparent;color:var(--ink2);border:1px solid var(--line)}
.daynav{display:flex;align-items:center;gap:8px;margin:14px 0 12px;user-select:none}
.daynav .c{flex:1;text-align:center}
.daynav .c b{display:block;font-size:17px;margin-top:3px}
.togg{width:52px;height:32px;border-radius:16px;background:var(--sunk);position:relative;flex:none;border:1px solid var(--line)}
.togg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--card);box-shadow:0 1px 2px #0003;transition:left .15s}
.togg.on{background:var(--accent);border-color:var(--accent)}.togg.on::after{left:23px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.rtable{width:100%;border-collapse:collapse;font-size:13px}
.rtable td,.rtable th{padding:8px 0;border-top:1px solid var(--line);text-align:right;font-family:'IBM Plex Mono',monospace;font-weight:500}
.rtable th{font-family:inherit;font-weight:400;color:var(--ink3);text-align:left;font-size:12px}
.rtable td:first-child{text-align:left;font-family:'IBM Plex Sans',sans-serif;color:var(--ink2);font-weight:400}
.ingrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 52px 36px;gap:8px;align-items:center;min-height:52px;border-top:1px solid var(--line)}
.ingrow .cell{font-size:15px}
.err-msg{color:var(--danger);font-size:13px}
@media (min-width:960px){
  body{padding-left:220px}
  .view{max-width:1040px;padding:0 32px 48px}
  .cols{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}

<script>
/* =========================================================================
   API: every read/write goes to Code.gs through google.script.run.
   Server functions return { ok, data, error }; call() unwraps that so the
   rest of the app sees exactly the data shapes the design expects.
   ========================================================================= */
const api = (function () {
  function call(fn, args) {
    return new Promise((resolve, reject) => {
      const run = window.google && google.script && google.script.run;
      if (!run) { reject(new Error('Open Logbook from its web app link.')); return; }
      while (args.length && args[args.length - 1] === undefined) args.pop();
      const r = run
        .withSuccessHandler(res => res && res.ok ? resolve(res.data) : reject(new Error((res && res.error) || 'Unexpected reply from the server')))

  }
  const fn = name => (...args) => call(name, args);
  return {
    getBootstrap:      fn('getBootstrap'),       // (today) -> everything the first screen needs, one round trip
    getTargets:        fn('getTargets'),
    getFoodLog:        fn('getFoodLog'),         // (date?) -> that day's entries, or all
    addFoodEntry:      fn('addFoodEntry'),
    updateFoodEntry:   fn('updateFoodEntry'),
    deleteFoodEntry:   fn('deleteFoodEntry'),
    getIngredients:    fn('getIngredients'),
    saveIngredient:    fn('saveIngredient'),
    getRecipes:        fn('getRecipes'),
    saveRecipe:        fn('saveRecipe'),
    getWater:          fn('getWater'),
    setWater:          fn('setWater'),
    getWeights:        fn('getWeights'),
    addWeight:         fn('addWeight'),
    getWellness:       fn('getWellness'),
    saveWellness:      fn('saveWellness'),
    getExercises:      fn('getExercises'),
    saveExercise:      fn('saveExercise'),
    getExerciseHistory:fn('getExerciseHistory'),
    getRoutines:       fn('getRoutines'),
    getWorkouts:       fn('getWorkouts'),
    addSet:            fn('addSet'),             // persist each completed set (crash-safe)
    saveWorkout:       fn('saveWorkout')
  };
})();

/* ===================== helpers ===================== */
function iso(d) { const z = new Date(d); return z.getFullYear() + '-' + String(z.getMonth() + 1).padStart(2, '0') + '-' + String(z.getDate()).padStart(2, '0'); }
function addDays(s, n) { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function recipeTotals(r, db) {
  const t = { kcal:0, p:0, c:0, f:0, fib:0, g:0 };
  (r.items || []).forEach(it => { const i = db.ingredients.find(x => x.id === it.ing); const g = parseFloat(it.g) || 0; if (!i) return; const k = g / 100; t.kcal += i.kcal * k; t.p += i.p * k; t.c += i.c * k; t.f += i.f * k; t.fib += (i.fib || 0) * k; t.g += g; });

}
function calc(kind, ref, qty, unit, db) {
  qty = parseFloat(qty) || 0;
  if (kind === 'ing') {
    const i = db.ingredients.find(x => x.id === ref); if (!i) return { kcal:0, p:0, c:0, f:0 };
    const k = (unit === 'pc' ? qty * (i.unit ? i.unit.g : 100) : qty) / 100;
    return { kcal: i.kcal * k, p: i.p * k, c: i.c * k, f: i.f * k };
  }
  const r = db.recipes.find(x => x.id === ref); if (!r) return { kcal:0, p:0, c:0, f:0 };

}
function refName(kind, ref, db) { const x = (kind === 'ing' ? db.ingredients : db.recipes).find(x => x.id === ref); return x ? x.name : 'Unknown'; }

function rollingAvg(vals, n) { return vals.map((_, i) => { const v = vals.slice(Math.max(0, i - n + 1), i + 1).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }); }

function relDay(s) { const d = Math.round((new Date(s + 'T12:00:00') - new Date(TODAY + 'T12:00:00')) / 864e5); return d === 0 ? 'Today' : d === -1 ? 'Yesterday' : d > 0 ? 'In ' + d + ' days' : (-d) + ' days ago'; }

function clock(ms) { const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); }

const MUSCLES = { chest:'Chest', lats:'Lats', upper_back:'Upper back', lower_back:'Lower back', front_delts:'Front delts', side_delts:'Side delts', rear_delts:'Rear delts', biceps:'Biceps', triceps:'Triceps', forearms:'Forearms', abs:'Abs / Core', quads:'Quads', hamstrings:'Hamstrings', glutes:'Glutes', calves:'Calves' };

const EQUIP = ['barbell','dumbbell','cable','machine','bodyweight'];
const cap = s => s[0].toUpperCase() + s.slice(1);

/* ===================== body map (original artwork; each muscle drawn for one side and mirrored) ===================== */
const MUSCLE_VIEWS = { chest:['front'], front_delts:['front'], side_delts:['front','back'], biceps:['front'], forearms:['front','back'], abs:['front'], quads:['front'], calves:['front','back'],
  upper_back:['back','front'], lats:['back'], rear_delts:['back'], triceps:['back'], lower_back:['back'], glutes:['back'], hamstrings:['back'] };
const GROUP_OF = Object.fromEntries(GROUPS.flatMap(([g, , ms]) => ms.map(m => [m, g])));
const BODY = (function () {
  const ARM = 'M49 114 L60 112 C61 130 57 146 52 158 L40 158 C39 140 43 124 49 114 Z';
  const FOREARM = 'M40 160 L52 160 C50 184 46 208 40 230 L28 227 C32 204 36 182 40 160 Z';
  return {
    skin: ['M91 62 C78 64 62 68 52 76 C44 80 38 90 36 104 L32 150 C30 170 26 200 24 224 C22 236 24 246 30 248 C38 248 42 240 42 230 L48 158 L56 124 C58 150 64 176 70 196 L64 226 C60 250 60 290 66 322 C62 350 64 380 70 404 L64 412 C60 420 62 426 72 426 L86 426 C88 416 86 408 84 402 C88 380 90 350 92 322 C96 296 99 270 99 246 L100 62 Z'],
    whole: ['M100 8 C113 8 119 19 118 32 C117 45 108 54 100 54 C92 54 83 45 82 32 C81 19 87 8 100 8 Z', 'M91 48 L109 48 L109 66 L91 66 Z'],
    front: [
      ['upper_back', 'M93 66 C82 68 68 71 57 78 C64 85 78 82 93 79 Z'],
      ['chest', 'M97 86 C86 83 72 84 60 90 C58 101 59 112 64 120 C74 126 88 124 97 118 Z'],
      ['front_delts', 'M60 84 C54 78 47 79 43 86 C41 95 43 105 49 112 C55 109 60 100 61 90 Z'],
      ['side_delts', 'M43 86 C37 89 34 97 35 107 C35 113 40 116 45 115 C48 114 49 113 49 112 C43 105 41 95 43 86 Z'],
      ['biceps', ARM], ['forearms', FOREARM],
      ['abs', 'M65 124 C64 152 68 176 74 194 L88 194 L88 126 C80 128 72 128 65 124 Z M91 128 L99 128 L99 142 L91 142 Z M91 146 L99 146 L99 160 L91 160 Z M91 164 L99 164 L99 180 L91 180 Z M91 184 L99 184 L99 196 L91 196 Z'],
      ['quads', 'M64 224 C57 252 57 290 66 322 L91 322 C95 298 98 272 99 244 L99 228 C86 232 74 230 64 224 Z'],
      ['calves', 'M68 330 C63 352 65 378 72 400 L83 400 C87 380 89 352 90 330 Z']
    ],
    back: [
      ['lats', 'M62 116 C70 112 80 116 88 128 L97 148 L97 192 L76 196 C66 176 62 146 62 116 Z'],
      ['upper_back', 'M97 64 C84 66 68 71 56 79 C64 96 80 112 97 146 Z'],
      ['rear_delts', 'M61 84 C54 79 47 80 43 87 C41 95 43 105 49 112 C55 108 60 98 62 90 Z'],
      ['side_delts', 'M43 87 C37 90 34 98 35 107 C35 113 40 116 45 115 C48 114 49 113 49 112 C43 105 41 96 43 87 Z'],
      ['triceps', ARM], ['forearms', FOREARM],
      ['lower_back', 'M97 152 C91 162 87 180 85 204 L97 210 Z'],
      ['glutes', 'M99 210 C84 204 68 210 62 224 C60 242 70 258 86 260 C94 260 99 254 99 246 Z'],
      ['hamstrings', 'M65 264 C60 284 62 308 68 322 L91 322 C95 304 98 284 99 264 C88 268 74 268 65 264 Z'],

    ],

})();
function bodySVG(view) {
  const mir = 'transform="translate(200 0) scale(-1 1)"', two = d => `<path d="${d}"/><path d="${d}" ${mir}/>`;

/* ===================== state ===================== */
const S = {

  food: { seg: 'log', q: '', meal: mealForTime(nowHM()), date: TODAY, addDate: TODAY, ingQ: '' },
  gym: { bank: false },
  ex: { q: '', group: null, sub: null, eq: [], mv: [], type: [], sort: 'az', view: 'front', detail: null, hist: null, from: null },
  wo: { active: null, summary: null },
  rest: { end: 0, total: 0, over: 0 },
  sheet: null, weightDraft: null, well: { sleep: 7, energy: null }

const failures = new Map();

/* ---------- optimistic persistence ---------- */

    .catch(() => {

}

/* ---------- derived data ---------- */
const dayLog = d => S.db.foodLog.filter(e => e.date === d).sort((a, b) => a.time.localeCompare(b.time));
const exById = id => S.db.exercises.find(e => e.id === id);
const lastWeight = () => [...S.db.weights].sort((a, b) => b.date.localeCompare(a.date))[0];
function qtyLabel(e) {
  const q = +e.qty;
  if (e.unit === 'g') return q + ' g';
  if (e.unit === 'srv') return q + (q === 1 ? ' serving' : ' servings');
  const i = S.db.ingredients.find(x => x.id === e.ref); const n = i && i.unit ? i.unit.name : 'pc';
  return q + ' ' + n + (q !== 1 && !/s$/.test(n) && n !== 'katori' ? 's' : '');

  const seen = new Set(), out = [];
  [...S.db.foodLog].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time)).forEach(e => {
    const k = e.kind + ':' + e.ref; if (seen.has(k) || out.length >= 8) return; seen.add(k); out.push(e);

}
function frequentFoods() {
  const since = addDays(TODAY, -14), c = {};

function lastTime(exId) {
  const w = [...S.db.workouts].filter(w => !String(w.id).startsWith('tmp') || w._s !== 'saving').sort((a, b) => b.date.localeCompare(a.date)).find(w => w.date < TODAY && w.ex.some(x => x.id === exId))

function setsText(sets) {

  const wt = w => w ? kg(w) + ' kg' : 'BW';
  if (ws.every(x => x === ws[0]) && rs.every(x => x === rs[0])) return `${sets.length} × ${rs[0]} @ ${wt(ws[0])}`;
  if (ws.every(x => x === ws[0])) return `${rs.join(', ')} @ ${wt(ws[0])}`;
  return sets.map(s => `${kg(s.w)}×${s.r}`).join(', ');
}
function bestOf(exId, excludeId) {
  let e1 = 0, w = 0, r = 0, reps = 0;
  S.db.workouts.forEach(wo => { if (wo.id === excludeId) return; wo.ex.forEach(x => { if (x.id !== exId) return; x.sets.forEach(s => { const v = e1rm(+s.w, +s.r); if (v > e1) e1 = v; if (+s.w > w || (+s.w === w && +s.r > r)) { w = +s.w; r = +s.r; } if (+s.r > reps) reps = +s.r; }); }); });
  return { e1, w, r, reps };
}
function nextRoutine() {
  const rot = S.db.rotation; const last = [...S.db.workouts].sort((a, b) => b.date.localeCompare(a.date)).find(w => rot.includes(w.routine));
  return last ? rot[(rot.indexOf(last.routine) + 1) % rot.length] : rot[0];

function consistency() {
  const since = addDays(TODAY, -27), done = new Set(S.db.workouts.filter(w => w.date >= since).map(w => w.date));
  const days = Array.from({ length: 14 }, (_, i) => addDays(TODAY, i - 13)).map(d => ({ d, on: S.db.workouts.some(w => w.date === d) }));
  let streak = 0; for (let i = 0; i < 12; i++) { const ws = addDays(weekStart(TODAY), -7 * i), we = addDays(ws, 6); const n = S.db.workouts.filter(w => w.date >= ws && w.date <= we).length; if (n >= 3 || (i === 0)) { if (i > 0 || n >= 3) streak += n >= 3 ? 1 : 0; } else break; }

}

}
function weekStats(ws) {

  const tots = days.map(d => dayLog(d)).filter(l => l.length).map(sumN);

/* ===================== charts (SVG) ===================== */
function lineChart(o) {
  const W = 340, H = o.h || 160, L = 34, R = 8, T = 10, B = 22, n = o.n;
  const X = i => L + (W - L - R) * (n <= 1 ? .5 : i / (n - 1)), Y = v => T + (H - T - B) * (1 - (v - o.min) / (o.max - o.min));
  let g = '';
  o.ticks.forEach(v => g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tl" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${o.tf ? o.tf(v) : v}</text>`);
  (o.xl || []).forEach(([i, l]) => g += `<text class="tl" x="${X(i)}" y="${H - 5}" text-anchor="middle">${l}</text>`);
  o.series.forEach(s => {
    let d = '', pen = false;
    s.pts.forEach((v, i) => { if (v == null) { if (!s.bridge) pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1); pen = true; });
    if (s.line !== false && d) g += `<path d="${d}" fill="none" style="stroke:${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? `stroke-dasharray="${s.dash}"` : ''}/>`;
    if (s.dots) s.pts.forEach((v, i) => { if (v != null) g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${s.r || 2.2}" style="fill:${s.color}"/>`; });
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'chart')}">${g}</svg>`;
}
function barChart(o) {
  const W = 340, H = o.h || 140, L = 34, R = 8, T = 16, B = 22, n = o.vals.length, bw = (W - L - R) / n;
  const Y = v => T + (H - T - B) * (1 - v / o.max);
  let g = '';
  o.ticks.forEach(v => g += `<line class="gl" x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}"/><text class="tl" x="${L - 6}" y="${Y(v) + 3}" text-anchor="end">${o.tf ? o.tf(v) : v}</text>`);
  o.vals.forEach((v, i) => {
    const x = L + i * bw + bw * .22, w = bw * .56;
    if (v != null && v > 0) g += `<rect x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${(Y(0) - Y(v)).toFixed(1)}" rx="2" style="fill:${o.color};opacity:${i === n - 1 ? 1 : .55}"/>`;
    if (o.showVals && v != null) g += `<text class="vl" x="${(x + w / 2).toFixed(1)}" y="${(Y(v || 0) - 4).toFixed(1)}" text-anchor="middle">${o.vf ? o.vf(v) : v}</text>`;
    if (o.labels[i]) g += `<text class="tl" x="${(x + w / 2).toFixed(1)}" y="${H - 5}" text-anchor="middle">${o.labels[i]}</text>`;
  });
  if (o.target) g += `<line x1="${L}" x2="${W - R}" y1="${Y(o.target)}" y2="${Y(o.target)}" style="stroke:var(--ink)" stroke-width="1" stroke-dasharray="3 3"/><text class="vl" x="${W - R}" y="${Y(o.target) - 4}" text-anchor="end">target</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'chart')}">${g}</svg>`;
}
function niceTicks(min, max, n) { const step = (max - min) / n; return Array.from({ length: n + 1 }, (_, i) => r1(min + step * i)); }

function exFilterMuscles(f) {
  if (f.sub) return [f.sub];
  const g = f.group ? GROUPS.find(x => x[0] === f.group) : null;
  return g ? g[2] : null;
}
/* AND across categories, OR within one. A muscle filter matches primary muscles first, then secondary ("assists"). */
function filterExercises(list, f) {
  const q = (f.q || '').trim().toLowerCase(), ms = exFilterMuscles(f), inSet = (arr, v) => !arr || !arr.length || arr.includes(v), out = [];
  list.forEach(e => {
    if (q && !e.name.toLowerCase().includes(q)) return;
    if (!inSet(f.eq, e.eq) || !inSet(f.mv, e.mv) || !inSet(f.type, e.type)) return;
    let role = 'primary';
    if (ms) { if (e.prim.some(m => ms.includes(m))) role = 'primary'; else if (e.sec.some(m => ms.includes(m))) role = 'secondary'; else return; }
    out.push({ e, role });
  });
  return out;
}
function lastDoneMap() { const m = {}; S.db.workouts.forEach(w => w.ex.forEach(x => { if (!m[x.id] || w.date > m[x.id]) m[x.id] = w.date; })); return m; }
function sortResults(res, mode) {
  const ld = mode === 'recent' ? lastDoneMap() : null, best = mode === 'best' ? Object.fromEntries(res.map(r => [r.e.id, bestOf(r.e.id).e1])) : null;
  return res.sort((a, b) => (a.role === b.role ? 0 : a.role === 'primary' ? -1 : 1)
    || (mode === 'recent' ? (ld[b.e.id] || '').localeCompare(ld[a.e.id] || '') : mode === 'best' ? (best[b.e.id] || 0) - (best[a.e.id] || 0) : 0)
    || a.e.name.localeCompare(b.e.name));
}
const viewHas = (view, m) => (MUSCLE_VIEWS[m] || ['front']).includes(view);
function exViewFor(ms) { const m = ms.find(x => viewHas(S.ex.view, x)); return m ? S.ex.view : (ms.length ? MUSCLE_VIEWS[ms[0]][0] : S.ex.view); }
function mapSpec() {

  return { view: S.ex.view, sel: exFilterMuscles(S.ex) || [] };

/* ===================== actions ===================== */
function logFood(entry, quick) {
  const n = calc(entry.kind, entry.ref, entry.qty, entry.unit, S.db);
  const e = { id: 'tmp' + Date.now() + Math.random().toString(36).slice(2, 5), name: refName(entry.kind, entry.ref, S.db), ...entry, ...n };
  S.db.foodLog.push(e);
  const key = 'food:' + e.id;
  persist(key, e.name, () => api.addFoodEntry(strip(e)), res => {
    failures.delete(key); e.id = res.id;
    if (e._undo) { api.deleteFoodEntry(res.id).catch(() => {}); }
  }, e);
  if (quick) toast(`Logged ${e.name} · ${qtyLabel(e)} to ${mealName(e.meal)}`, 'Undo', () => {
    S.db.foodLog = S.db.foodLog.filter(x => x !== e); failures.delete(key);
    if (e._s === 'saving') e._undo = true; else if (!String(e.id).startsWith('tmp')) api.deleteFoodEntry(e.id).catch(() => {});
    render();
  });

  foodQ: el => { S.food.q = el.value; render(); },
  ingQ: el => { S.food.ingQ = el.value; render(); },
  exQ: el => { S.ex.q = el.value; render(); },
  pickQ: el => { S.sheet.q = el.value; renderSheet(); },
  weight: el => { S.weightDraft = el.value; },
  qty: el => { S.sheet.qty = el.value; const p = qtyPreview(S.sheet); $('#qprev').innerHTML = p.html; $('#qsave').textContent = (S.sheet.mode === 'edit' ? 'Save changes' : 'Add to ' + mealName(S.sheet.meal)) + ' · ' + fmt(p.n.kcal) + ' kcal'; },
  qtyTime: el => { S.sheet.time = el.value; },
  qtyDate: el => { if (el.value) S.sheet.date = el.value > TODAY ? TODAY : el.value; },
  rName: el => { S.sheet.name = el.value; },
  rServ: el => { S.sheet.servings = el.value; $('#rtot').innerHTML = recipeTotalsTable(recipeTotals(S.sheet, S.db), Math.max(1, parseFloat(el.value) || 1)); },
  rG: el => { const i = +el.dataset.i, it = S.sheet.items[i]; it.g = el.value; const ing = S.db.ingredients.find(x => x.id === it.ing); const k = document.querySelector(`[data-rk="${i}"]`); if (k) k.textContent = fmt(ing.kcal * (parseFloat(el.value) || 0) / 100); $('#rtot').innerHTML = recipeTotalsTable(recipeTotals(S.sheet, S.db), Math.max(1, parseFloat(S.sheet.servings) || 1)); },
  rQ: el => { S.sheet.addQ = el.value; renderSheet(); },
  ingF: el => { S.sheet[el.dataset.f] = el.value; },
  exfName: el => { S.sheet.name = el.value; },
  exfText: el => { S.sheet[el.dataset.f] = el.value; },
  set: el => { const s = S.wo.active.exercises[+el.dataset.e].sets[+el.dataset.s]; s[el.dataset.f] = el.value; saveActive(); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('input', e => { const el = e.target.closest('[data-in]'); if (el && INPUT[el.dataset.in]) INPUT[el.dataset.in](el); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.entry')) { e.preventDefault(); e.target.click(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.mus')) { e.preventDefault(); A.muscle(e.target); }
  if (e.key === 'Enter' && e.target.matches('[data-in=weight]')) A.weightSave();
});
// swipe between days in Food › Day
let sx = null, sy = null;
document.addEventListener('touchstart', e => { if (e.target.closest('#swipe')) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, { passive: true });
document.addEventListener('touchend', e => {
  if (sx == null) return; const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { const d = addDays(S.food.date, dx < 0 ? 1 : -1); if (d <= TODAY) { S.food.date = d; ensureDay(d); render(); } }
}, { passive: true });

/* ===================== render ===================== */
function keepFocus(fn) {
  const a = document.activeElement, k = a && a.dataset ? a.dataset.k : null; let s = null;
  try { s = a.selectionStart; } catch (e) {}
  fn();
  if (k) { const n = document.querySelector(`[data-k="${k}"]`); if (n) { n.focus({ preventScroll: true }); try { if (s != null) n.setSelectionRange(s, s); } catch (e) {} } }
}
function render() {
  const TABS = [['today','Today'],['food','Food'],['gym','Gym'],['progress','Progress']];
  $('#nav').innerHTML = `<div class="brand"><div class="eyebrow">Logbook</div></div>` + TABS.map(([k, l]) => `<button class="${S.tab === k ? 'on' : ''}" data-a="tab" data-t="${k}" aria-current="${S.tab === k ? 'page' : 'false'}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}${k === 'gym' && S.wo.active ? ' ●' : ''}</button>`).join('');
  keepFocus(() => {
    $('#view').innerHTML = S.loading ? skeleton() : { today: vToday, food: vFood, gym: vGym, progress: vProgress }[S.tab]();
    const slot = $('#mapslot'); if (slot) { slot.replaceWith(mapEl()); syncMap(mapSpec()); }
  });
  $('#view').dataset.screenLabel = S.tab;
  $('#fabwrap').innerHTML = !S.loading && (S.tab === 'today' || (S.tab === 'food' && S.food.seg === 'day')) ? `<button class="fab" data-a="fab"><span>+</span>Log food</button>` : '';
  tick();
}
function tick() {
  const now = Date.now();
  if (S.wo.active) document.querySelectorAll('[data-elapsed]').forEach(n => n.textContent = clock(now - S.wo.active.start));
  const el = $('#rest');
  if (S.rest.end && now < S.rest.end) {
    const left = S.rest.end - now, pct = Math.min(100, left / S.rest.total * 100);
    if (!el.firstChild) el.innerHTML = `<div class="r"><i></i><span class="eyebrow" style="margin-right:4px">Rest</span><b></b><button data-a="restAdj" data-d="-15">−15</button><button data-a="restAdj" data-d="15">+15</button><button data-a="restSkip">Skip</button></div>`;
    el.querySelector('b').textContent = clock(left); el.querySelector('i').style.width = pct + '%';
    $('#fabwrap').style.display = 'none';
  } else if (S.rest.end && now >= S.rest.end) {
    S.rest.end = 0; S.rest.over = now; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {}
    el.innerHTML = `<div class="r"><b style="font-size:16px;font-family:inherit">Rest over — next set</b><button data-a="restSkip">OK</button></div>`;
  } else if (S.rest.over && now - S.rest.over > 4000) { S.rest.over = 0; el.innerHTML = ''; $('#fabwrap').style.display = ''; }
  else if (!S.rest.end && !S.rest.over) { el.innerHTML = ''; $('#fabwrap').style.display = ''; }
}
setInterval(tick, 250);

/* ===================== boot ===================== */
(async function init() {
  try { const t = localStorage.getItem('logbook_theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  render();
  try {
    const b = await api.getBootstrap(TODAY);
    S.db = { targets: b.targets, foodLog: b.foodLog, ingredients: b.ingredients, recipes: b.recipes, water: b.water, weights: b.weights, wellness: b.wellness,
             exercises: b.exercises, routines: b.routines, workouts: b.workouts, rotation: b.rotation, foodLogFrom: b.foodLogFrom };
    try { const a = JSON.parse(localStorage.getItem('logbook_active_workout') || 'null'); if (a && a.exercises) S.wo.active = a; } catch (e) {}
    const lw = S.db.wellness.slice().sort((a, b) => b.date.localeCompare(a.date))[0]; if (lw) S.well.sleep = lw.sleep;
    S.loading = false; render();
  } catch (err) {
    $('#view').innerHTML = `<div class="empty" style="min-height:70vh;justify-content:center"><b>Couldn't load your data</b><span>${esc(err.message)}</span><button class="btn primary" onclick="location.reload()">Try again</button></div>`;
  }
})();
</script>


</body></html>
